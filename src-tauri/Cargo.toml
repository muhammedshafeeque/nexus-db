[package]
name = "nexus-db"
version = "0.1.0"
description = "Nexus DB – one client for every database"
edition = "2021"

[lib]
name = "nexus_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
dbcore = { path = "dbcore" }

[workspace]
members = ["dbcore"]

[profile.release]
codegen-units = 1
lto = true
strip = true
